[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantml-research-platform"
version = "0.1.0"
description = "Leakage-aware ML strategy research and transaction-cost-aware backtesting for daily equity data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11",
    "scikit-learn>=1.4,<2",
    "statsmodels>=0.14",
    "yfinance>=0.2.40",
    "PyYAML>=6.0",
    "plotly>=5.20",
    "streamlit>=1.35",
]

[project.urls]
Repository = "https://github.com/DIVY3200/QuantML-Research"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:yfinance.*"]
